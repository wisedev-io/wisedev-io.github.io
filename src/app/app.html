<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-group">
      <a routerLink="/" class="brand-name">Kamoliddin Rasulov</a>
      <a href="https://www.google.com/maps/search/?api=1&query=40.38,71.78" target="_blank" rel="noopener" class="coords" style="text-decoration:none">
        <span class="dot">●</span> FERGANA, UZBEKISTAN <span class="local-time">{{ localTime() }}</span>
      </a>
    </div>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ i18n.t().nav.work }}</a>
      <a routerLink="/about" routerLinkActive="active">{{ i18n.t().nav.about }}</a>
      <a routerLink="/contact" routerLinkActive="active">{{ i18n.t().nav.contact }}</a>
      <div class="lang-toggle" role="group" aria-label="Switch language">
        <button type="button" [class.active]="i18n.lang() === 'en'" (click)="i18n.setLang('en')">EN</button>
        <span class="sep">/</span>
        <button type="button" [class.active]="i18n.lang() === 'uz'" (click)="i18n.setLang('uz')">UZ</button>
        <span class="sep">/</span>
        <button type="button" [class.active]="i18n.lang() === 'ru'" (click)="i18n.setLang('ru')">RU</button>
      </div>
    </nav>
  </div>
</header>

<router-outlet />

<footer class="site">
  <div>{{ i18n.t().footer.rights }}</div>
  <div>{{ i18n.t().footer.built }}</div>
</footer>
