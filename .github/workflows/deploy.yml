name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build
      # SPA fallback: GitHub Pages serves 404.html for unknown paths,
      # so deep links like /projects/energy-audit-platform work.
      - run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Sync frontend build (self-hosted mirror at :8091)
        run: >
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key"
          dist/portfolio/browser/ deployer@${{ secrets.DEPLOY_HOST }}:/opt/kamoliddin-cv/public/
      - name: Sync backend
        run: >
          rsync -avz -e "ssh -i ~/.ssh/deploy_key"
          backend/app.py backend/requirements.txt
          deployer@${{ secrets.DEPLOY_HOST }}:/opt/kamoliddin-cv/backend/
      - name: Install deps and restart API
        run: >
          ssh -i ~/.ssh/deploy_key deployer@${{ secrets.DEPLOY_HOST }}
          "cd /opt/kamoliddin-cv/backend && ./.venv/bin/pip install -q -r requirements.txt && sudo systemctl restart kamoliddin-cv-api.service"
